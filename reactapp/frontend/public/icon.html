<!DOCTYPE html>
<html>
<head>
<style type="text/css">
.mainwrapper {
  -webkit-mask-repeat: no-repeat;
  -webkit-mask-image: url('http:localhost:3000/icon-4.svg');
}

.treewrapper {
  -webkit-mask-repeat: no-repeat;
  -webkit-mask-image: url('http:localhost:3000/plantIcon2.svg');
  transform: scale(26.5);
  transform-origin: 0 0;
}

.linewrapper {
	transform-origin: 0 0;
    transform: scale(0.05) !important;
}

.line {
  width: 100%;
  height: 70px;
}

.red {
  background-color: rgb(216,29,4);
}

.orange {
  background-color: rgb(252,127,63);
}

.yellow {
  background-color: rgb(249,232,18);
}

.green {
  background-color: rgb(97,198,89);
}

.blue {
  background-color: rgb(0,127,255);
}

.purple {
  background-color: rgb(115,1,136);
}
</style>
</head>
<body>   
	<div class="mainwrapper">
		<div class="linewrapper">
			<div class="line red"></div>
		    <div class="line orange"></div>
		    <div class="line yellow"></div>
		    <div class="line green"></div>
		    <div class="line blue"></div>
		    <div class="line purple"></div>   
    	</div>
	</div>  
</body>
</html>
